<div class="flex h-screen font-sans" style="background:#F5F6F8">

  <!-- Sidebar -->
  <aside class="flex flex-shrink-0 flex-col bg-white border-r" style="width:236px;border-color:#E6E8EC">

    <!-- Logo -->
    <div class="flex items-center gap-2.5 px-5 py-4">
      <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-[6px] text-[11px] font-extrabold text-white" style="background:#3B4FD9">W</div>
      <span class="text-[15px] font-extrabold tracking-tight" style="color:#14161C">Waypoint</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 space-y-0.5 px-3 py-1">
      @if (isAdmin) {
        <a routerLink="/dashboard" routerLinkActive="active-nav"
           class="nav-link" style="display:flex;align-items:center;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;text-decoration:none;color:#4B5160;transition:background .15s,color .15s"
           [style.background]="(pageTitle() === 'Dashboard') ? '#EAF0FE' : ''"
           [style.color]="(pageTitle() === 'Dashboard') ? '#3B4FD9' : ''">
          Dashboard
        </a>
        <a routerLink="/projects" routerLinkActive="active-nav"
           class="nav-link" style="display:flex;align-items:center;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;text-decoration:none;color:#4B5160;transition:background .15s,color .15s"
           [style.background]="(pageTitle() === 'Projects') ? '#EAF0FE' : ''"
           [style.color]="(pageTitle() === 'Projects') ? '#3B4FD9' : ''">
          Projects
        </a>
        <a routerLink="/users" routerLinkActive="active-nav"
           class="nav-link" style="display:flex;align-items:center;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;text-decoration:none;color:#4B5160;transition:background .15s,color .15s"
           [style.background]="(pageTitle() === 'Users') ? '#EAF0FE' : ''"
           [style.color]="(pageTitle() === 'Users') ? '#3B4FD9' : ''">
          Users
        </a>
      } @else {
        <a routerLink="/dashboard" class="nav-link"
           style="display:flex;align-items:center;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;text-decoration:none;color:#4B5160;transition:background .15s,color .15s"
           [style.background]="(pageTitle() === 'Dashboard') ? '#EAF0FE' : ''"
           [style.color]="(pageTitle() === 'Dashboard') ? '#3B4FD9' : '#4B5160'">
          Dashboard
        </a>
        <a routerLink="/projects" class="nav-link"
           style="display:flex;align-items:center;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;text-decoration:none;color:#4B5160;transition:background .15s,color .15s"
           [style.background]="(pageTitle() === 'Projects') ? '#EAF0FE' : ''"
           [style.color]="(pageTitle() === 'Projects') ? '#3B4FD9' : '#4B5160'">
          Projects
        </a>
      }
    </nav>

    <!-- User card -->
    <div class="flex items-center gap-2.5 border-t px-4 py-3" style="border-color:#E6E8EC">
      <a routerLink="/profile" class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full text-[11px] font-bold" style="background:#EAF0FE;color:#3B4FD9;text-decoration:none">
        {{ currentUser?.fullName | initials }}
      </a>
      <a routerLink="/profile" class="min-w-0 flex-1" style="text-decoration:none">
        <p class="truncate text-[13px] font-semibold" style="color:#14161C">{{ currentUser?.fullName }}</p>
        <p class="text-[11px]" style="color:#9AA1AC">{{ roleLabel }}</p>
      </a>
      <button (click)="logout()" class="flex-shrink-0 text-[12px] hover:underline" style="color:#6B7280">Exit</button>
    </div>
  </aside>

  <!-- Main column -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">

    <!-- Top bar -->
    <header class="flex h-[58px] flex-shrink-0 items-center justify-between border-b bg-white px-8" style="border-color:#E6E8EC">
      <h1 class="text-[15px] font-extrabold tracking-tight" style="color:#14161C">{{ pageTitle() }}</h1>
      <span class="text-[13px]" style="color:#9AA1AC">{{ todayDate }}</span>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto" style="padding:28px 32px">
      <router-outlet />
    </main>
  </div>
</div>
