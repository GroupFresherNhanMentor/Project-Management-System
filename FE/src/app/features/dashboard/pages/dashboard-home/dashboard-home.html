<div class="p-6">
  <h1 class="mb-6 text-xl font-semibold text-slate-900">My Dashboard</h1>

  @if (data(); as stats) {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
      <div class="rounded-lg border border-slate-200 bg-white p-4">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Open Tasks</p>
        <p class="mt-2 text-3xl font-bold text-slate-900">{{ stats.myOpenTasks }}</p>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Completed</p>
        <p class="mt-2 text-3xl font-bold text-green-600">{{ stats.myCompletedTasks }}</p>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Overdue</p>
        <p class="mt-2 text-3xl font-bold text-red-600">{{ stats.myOverdueTasks }}</p>
      </div>
      <div class="rounded-lg border border-slate-200 bg-white p-4">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Hours Logged</p>
        <p class="mt-2 text-3xl font-bold text-slate-900">{{ stats.totalLoggedHours }}h</p>
      </div>
    </div>
  }
</div>
