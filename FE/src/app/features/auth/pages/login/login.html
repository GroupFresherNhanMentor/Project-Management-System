<div class="flex min-h-screen items-center justify-center font-sans" style="background:#F5F6F8">
  <section class="w-full rounded-[14px] bg-white px-8 py-8" style="max-width:400px;box-shadow:0 20px 50px -20px rgba(20,24,40,0.15)">

    <!-- Logo -->
    <div class="mb-6 flex items-center gap-2.5">
      <div class="flex h-7 w-7 items-center justify-center rounded-[6px] text-[11px] font-extrabold text-white" style="background:#3B4FD9">W</div>
      <span class="text-[15px] font-extrabold tracking-tight" style="color:#14161C">Waypoint</span>
    </div>

    <h1 class="text-[22px] font-extrabold tracking-tight" style="color:#14161C">Sign in</h1>
    <p class="mt-1 text-[13px]" style="color:#9AA1AC">Mini Project Management System</p>

    <form class="mt-6 space-y-3" (ngSubmit)="submit()">
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Username"
        class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none transition"
        style="border-color:#E1E4E9;color:#14161C"
      />

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none transition"
        style="border-color:#E1E4E9;color:#14161C"
      />

      @if (errorMessage()) {
        <p class="rounded-[7px] px-3 py-2 text-[12px]" style="background:#FDECEC;color:#D0342C">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="mt-1 w-full rounded-[8px] py-2.5 text-[13px] font-bold text-white transition disabled:opacity-60"
        style="background:#3B4FD9"
        onmouseover="this.style.background='#2F40C4'"
        onmouseout="this.style.background='#3B4FD9'"
      >
        {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</div>
