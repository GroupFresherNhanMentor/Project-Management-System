<!-- Search + new user -->
<div class="mb-4 flex items-center gap-3">
  <input
    [(ngModel)]="keyword" (ngModelChange)="page=0;load()"
    placeholder="Search users…"
    class="rounded-[8px] border px-3 py-2 text-[13px] outline-none focus:border-primary"
    style="border-color:#E1E4E9;min-width:240px;color:#14161C"
  />
  <div class="ml-auto">
    <a routerLink="/users/new" class="inline-flex items-center rounded-[8px] px-4 py-2 text-[13px] font-semibold text-white" style="background:#3B4FD9;text-decoration:none">+ New User</a>
  </div>
</div>

<!-- Users table -->
<div class="overflow-hidden rounded-[12px] border bg-white" style="border-color:#E6E8EC">
  <table class="w-full">
    <thead style="background:#FAFBFC">
      <tr class="border-b" style="border-color:#E6E8EC">
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Emp ID</th>
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Full Name</th>
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Email</th>
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Role</th>
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Status</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody>
      @for (u of users(); track u.id) {
        <tr class="border-b" style="border-color:#F0F1F3">
          <td class="px-4 py-3 text-[13px]" style="color:#4B5160">{{ u.employeeId }}</td>
          <td class="px-4 py-3 text-[13px] font-medium" style="color:#14161C">{{ u.fullName }}</td>
          <td class="px-4 py-3 text-[13px]" style="color:#4B5160">{{ u.email }}</td>
          <td class="px-4 py-3 text-[13px] font-semibold" style="color:#4B5160">{{ u.role }}</td>
          <td class="px-4 py-3"><span [class]="statusBadge(u.status)">{{ u.status }}</span></td>
          <td class="px-4 py-3 text-right">
            <div class="flex items-center justify-end gap-3">
              <button (click)="openEdit(u)" class="text-[13px] font-medium hover:underline" style="color:#3B4FD9">Edit</button>
              <button (click)="toggleLock(u)" class="text-[13px] font-medium hover:underline" [style.color]="u.status === 'ACTIVE' ? '#D0342C' : '#1C8A4B'">
                {{ u.status === 'ACTIVE' ? 'Lock' : 'Unlock' }}
              </button>
            </div>
          </td>
        </tr>
      }
      @empty {
        <tr><td colspan="6" class="px-4 py-10 text-center text-[13px]" style="color:#9AA1AC">No users found.</td></tr>
      }
    </tbody>
  </table>
</div>

<!-- Pagination -->
<div class="mt-3 flex items-center justify-center gap-4 text-[13px]" style="color:#4B5160">
  <button (click)="prevPage()" [disabled]="page === 0" class="rounded-[7px] border px-3 py-1.5 disabled:opacity-40" style="border-color:#E1E4E9">‹ Prev</button>
  <span>Page {{ page + 1 }} of {{ totalPages }}</span>
  <button (click)="nextPage()" [disabled]="page >= totalPages - 1" class="rounded-[7px] border px-3 py-1.5 disabled:opacity-40" style="border-color:#E1E4E9">Next ›</button>
</div>

<!-- Edit modal -->
@if (editTarget) {
  <div class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(20,22,28,0.4)">
    <div class="w-full rounded-[14px] bg-white p-6" style="max-width:400px;box-shadow:0 20px 50px -20px rgba(20,24,40,0.3)">
      <h3 class="mb-4 text-[15px] font-extrabold" style="color:#14161C">Edit User</h3>
      <div class="flex flex-col gap-3">
        <div>
          <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Full Name</label>
          <input [(ngModel)]="editFullName" class="w-full rounded-[8px] border px-3 py-2 text-[13px] outline-none" style="border-color:#E1E4E9" />
        </div>
        <div>
          <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Email</label>
          <input [(ngModel)]="editEmail" type="email" class="w-full rounded-[8px] border px-3 py-2 text-[13px] outline-none" style="border-color:#E1E4E9" />
        </div>
        <div>
          <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Role</label>
          <select [(ngModel)]="editRole" class="w-full rounded-[8px] border px-3 py-2 text-[13px] outline-none" style="border-color:#E1E4E9">
            @for (r of roles; track r) { <option [value]="r">{{ r }}</option> }
          </select>
        </div>
      </div>
      <div class="mt-4 flex gap-2">
        <button (click)="saveEdit()" class="rounded-[8px] px-5 py-2.5 text-[13px] font-bold text-white" style="background:#3B4FD9">Save</button>
        <button (click)="editTarget=null" class="rounded-[8px] border px-5 py-2.5 text-[13px] font-medium" style="border-color:#E1E4E9;color:#4B5160">Cancel</button>
      </div>
    </div>
  </div>
}
