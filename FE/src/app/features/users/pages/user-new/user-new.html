<a routerLink="/users" class="mb-5 inline-flex items-center gap-1 text-[13px] hover:underline" style="color:#3B4FD9;text-decoration:none">← Back to Users</a>

<div class="rounded-[12px] border bg-white p-6" style="border-color:#E6E8EC;max-width:640px">
  <h2 class="mb-1 text-[18px] font-extrabold" style="color:#14161C">New User</h2>
  <p class="mb-5 text-[12px]" style="color:#9AA1AC">Create a new system user (Administrator only)</p>

  <div class="flex flex-col gap-4">

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Employee ID</label>
        <input [(ngModel)]="employeeId" placeholder="e.g. EMP007" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9;color:#14161C" />
      </div>
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Username *</label>
        <input [(ngModel)]="username" placeholder="e.g. john.doe" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9;color:#14161C" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Full Name *</label>
        <input [(ngModel)]="fullName" placeholder="John Doe" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9;color:#14161C" />
      </div>
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Email *</label>
        <input [(ngModel)]="email" type="email" placeholder="john@waypoint.io" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9;color:#14161C" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Password *</label>
        <input [(ngModel)]="password" type="password" placeholder="Min 8 characters" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9;color:#14161C" />
      </div>
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Role</label>
        <select [(ngModel)]="role" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9;color:#14161C">
          @for (r of roles; track r) { <option [value]="r">{{ r }}</option> }
        </select>
      </div>
    </div>

    <div class="flex gap-3 pt-2">
      <button
        (click)="submit()"
        [disabled]="submitting()"
        class="rounded-[8px] px-6 py-2.5 text-[13px] font-bold text-white disabled:opacity-60"
        style="background:#3B4FD9"
      >{{ submitting() ? 'Creating…' : 'Create User' }}</button>
      <a routerLink="/users" class="inline-flex items-center rounded-[8px] border px-6 py-2.5 text-[13px] font-medium" style="border-color:#E1E4E9;color:#4B5160;text-decoration:none">Cancel</a>
    </div>

  </div>
</div>
