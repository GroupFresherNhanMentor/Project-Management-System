<a routerLink="/users" class="mb-5 inline-flex items-center gap-1 text-[13px]" style="color:#3B4FD9">‹ Back to Users</a>

<div class="rounded-[12px] border bg-white p-6" style="border-color:#E6E8EC;max-width:640px">
  <h2 class="mb-5 text-[16px] font-extrabold" style="color:#14161C">New User</h2>
  <div class="flex flex-col gap-3">

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Employee ID</label>
        <input [(ngModel)]="employeeId" placeholder="e.g. EMP007" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9" />
      </div>
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Username *</label>
        <input [(ngModel)]="username" placeholder="e.g. john.doe" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Full Name *</label>
        <input [(ngModel)]="fullName" placeholder="John Doe" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9" />
      </div>
      <div>
        <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Email *</label>
        <input [(ngModel)]="email" type="email" placeholder="john@waypoint.io" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9" />
      </div>
    </div>

    <div style="max-width:200px">
      <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Role</label>
      <select [(ngModel)]="role" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9">
        @for (r of roles; track r) { <option [value]="r">{{ r }}</option> }
      </select>
    </div>

    <div class="flex gap-2 pt-1">
      <button
        (click)="submit()"
        [disabled]="submitting"
        class="rounded-[8px] px-5 py-2.5 text-[13px] font-bold text-white disabled:opacity-60"
        style="background:#3B4FD9"
      >Create</button>
      <a routerLink="/users" class="inline-flex items-center rounded-[8px] border px-5 py-2.5 text-[13px] font-medium" style="border-color:#E1E4E9;color:#4B5160;text-decoration:none">Cancel</a>
    </div>

  </div>
</div>
