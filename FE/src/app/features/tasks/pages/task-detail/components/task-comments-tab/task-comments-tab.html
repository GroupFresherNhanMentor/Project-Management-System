<div class="flex flex-col gap-4">
  @for (c of comments(); track c.id) {
    <div class="flex gap-3">
      <div class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full text-[11px] font-bold" style="background:#EAF0FE;color:#3B4FD9">
        {{ c.createdBy | initials }}
      </div>
      <div>
        <p class="text-[12px] font-medium" style="color:#4B5160">{{ c.createdByName }} <span style="color:#9AA1AC;font-weight:400">· {{ c.createdTime }}</span></p>
        <p class="mt-0.5 text-[13px]" style="color:#14161C">{{ c.content }}</p>
      </div>
    </div>
  }
  @empty { <p class="text-[13px]" style="color:#9AA1AC">No comments yet.</p> }

  <div class="mt-2 flex gap-2 border-t pt-4" style="border-color:#F0F1F3">
    <textarea [(ngModel)]="newComment" rows="2" placeholder="Add a comment…" class="flex-1 rounded-[8px] border px-3 py-2 text-[13px] outline-none resize-none" style="border-color:#E1E4E9"></textarea>
    <button (click)="postComment()" class="rounded-[8px] px-4 py-2 text-[13px] font-semibold text-white self-end" style="background:#3B4FD9">Post</button>
  </div>
</div>
