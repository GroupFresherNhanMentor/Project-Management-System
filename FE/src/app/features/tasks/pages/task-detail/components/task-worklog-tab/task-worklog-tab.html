<div class="flex flex-col gap-3">
  @for (wl of worklogs(); track wl.id) {
    <div class="flex items-center justify-between rounded-[8px] border p-3" style="border-color:#E6E8EC">
      <div>
        <p class="text-[13px] font-medium" style="color:#14161C">{{ wl.workDate }} · {{ wl.hour }}h</p>
        <p class="text-[12px]" style="color:#6B7280">{{ wl.createdBy }}{{ wl.description ? ' — ' + wl.description : '' }}</p>
      </div>
      @if (isMyWorklog(wl)) {
        <button (click)="deleteWorklog(wl)" class="text-[12px] hover:underline" style="color:#D0342C">Delete</button>
      }
    </div>
  }
  @empty { <p class="text-[13px]" style="color:#9AA1AC">No worklogs yet.</p> }

  <div class="mt-2 rounded-[9px] border p-4" style="border-color:#E1E4E9;background:#FAFBFC">
    <p class="mb-3 text-[12px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Log time</p>
    <div class="flex flex-wrap gap-2">
      <input [(ngModel)]="newWorklogDate" type="date" class="rounded-[8px] border px-3 py-2 text-[13px] outline-none" style="border-color:#E1E4E9" />
      <input [(ngModel)]="newWorklogHours" type="number" placeholder="Hours" min="0" max="24" class="w-24 rounded-[8px] border px-3 py-2 text-[13px] outline-none" style="border-color:#E1E4E9" />
      <input [(ngModel)]="newWorklogDesc" placeholder="Description" class="flex-1 rounded-[8px] border px-3 py-2 text-[13px] outline-none" style="border-color:#E1E4E9;min-width:160px" />
      <button (click)="addWorklog()" class="rounded-[8px] px-4 py-2 text-[13px] font-semibold text-white" style="background:#3B4FD9">Add</button>
    </div>
  </div>
</div>
