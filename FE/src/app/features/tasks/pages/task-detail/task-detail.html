<button (click)="goBack()" class="mb-5 inline-flex items-center gap-1 text-[13px] hover:underline" style="color:#3B4FD9;background:none;border:none;cursor:pointer;padding:0">‹ Back</button>

@if (loading()) {
  <p class="text-[13px]" style="color:#9AA1AC">Loading task…</p>
} @else if (taskSvc.task(); as t) {
  <!-- Header card -->
  <div class="mb-4 rounded-[12px] border bg-white p-5" style="border-color:#E6E8EC">
    <p class="mb-1 text-[12px]" style="color:#9AA1AC">
      {{ t.taskKey }} · <span style="color:#3B4FD9;font-weight:600">{{ typeLabel(t.taskType) }}</span>
      &nbsp;·&nbsp;
      <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold text-white"
            [style.background-color]="t.statusColor">{{ t.statusName }}</span>
    </p>
    <h2 class="text-[19px] font-extrabold leading-snug" style="color:#14161C">{{ t.summary }}</h2>
  </div>

  <!-- Tabs -->
  <div class="mb-0 flex border-b" style="border-color:#E6E8EC">
    @for (tab of tabs; track tab) {
      <a
        [routerLink]="tab"
        routerLinkActive
        #rla="routerLinkActive"
        class="px-5 py-3 text-[13px] font-semibold capitalize transition"
        [style.color]="rla.isActive ? '#3B4FD9' : '#6B7280'"
        [style.border-bottom]="rla.isActive ? '2px solid #3B4FD9' : '2px solid transparent'"
      >{{ tab }}</a>
    }
  </div>

  <!-- Tab content via child routes -->
  <div class="rounded-b-[12px] border border-t-0 bg-white p-5" style="border-color:#E6E8EC">
    <router-outlet />
  </div>
} @else {
  <p class="text-[13px]" style="color:#9AA1AC">Task not found.</p>
}
