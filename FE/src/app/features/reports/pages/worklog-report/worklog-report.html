<div class="p-6">
  <h1 class="mb-4 text-xl font-semibold text-slate-900">Worklog Report</h1>

  @if (data(); as page) {
    <div class="overflow-hidden rounded-lg border border-slate-200 bg-white">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-left text-xs font-medium uppercase tracking-wide text-slate-500">
          <tr>
            <th class="px-4 py-3">User</th>
            <th class="px-4 py-3">Total Hours</th>
            <th class="px-4 py-3">Tasks</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (item of page.items; track item.userId) {
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-3 font-medium text-slate-900">{{ item.userName }}</td>
              <td class="px-4 py-3 text-slate-600">{{ item.totalHours }}h</td>
              <td class="px-4 py-3 text-slate-600">{{ item.numberOfTasks }}</td>
            </tr>
          }
          @empty {
            <tr><td colspan="3" class="px-4 py-8 text-center text-slate-400">No worklog data.</td></tr>
          }
        </tbody>
      </table>
    </div>
    <p class="mt-2 text-xs text-slate-400">{{ page.totalElements }} total</p>
  }
</div>
