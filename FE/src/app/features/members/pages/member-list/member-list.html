<div class="mb-4">
  <button (click)="newMember()" class="rounded-[8px] px-4 py-2 text-[13px] font-semibold text-white" style="background:#3B4FD9">+ Add Member</button>
</div>

<div class="overflow-hidden rounded-[12px] border bg-white" style="border-color:#E6E8EC">
  <table class="w-full">
    <thead style="background:#FAFBFC">
      <tr class="border-b" style="border-color:#E6E8EC">
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Member</th>
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Project Role</th>
        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-widest" style="color:#9AA1AC">Status</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody>
      @for (m of members(); track m.id) {
        <tr class="border-b" style="border-color:#F0F1F3">
          <td class="px-4 py-3">
            <div class="flex items-center gap-2.5">
              <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-[11px] font-bold" style="background:#EAF0FE;color:#3B4FD9">
                {{ m.userFullName | initials }}
              </div>
              <span class="text-[13px] font-medium" style="color:#14161C">{{ m.userFullName }}</span>
            </div>
          </td>
          <td class="px-4 py-3 text-[13px]" style="color:#4B5160">{{ m.projectRole }}</td>
          <td class="px-4 py-3"><span [class]="statusBadge(m.status)">{{ m.status }}</span></td>
          <td class="px-4 py-3 text-right">
            <button (click)="removeMember(m)" class="text-[13px] font-medium hover:underline" style="color:#D0342C">Remove</button>
          </td>
        </tr>
      }
      @empty {
        <tr><td colspan="4" class="px-4 py-10 text-center text-[13px]" style="color:#9AA1AC">No members yet.</td></tr>
      }
    </tbody>
  </table>
</div>
