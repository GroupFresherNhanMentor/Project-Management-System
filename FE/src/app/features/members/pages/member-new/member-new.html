<button (click)="cancel()" class="mb-5 inline-flex items-center gap-1 text-[13px] hover:underline" style="color:#3B4FD9">&lsaquo; Back to Members</button>

<div class="rounded-[12px] border bg-white p-6" style="border-color:#E6E8EC;max-width:640px">
  <h2 class="mb-1 text-[16px] font-extrabold" style="color:#14161C">Add Member</h2>
  <p class="mb-5 text-[12px]" style="color:#9AA1AC">Choose an active user who is not already a member of this project.</p>

  <div class="flex flex-col gap-3">
    <div>
      <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">User *</label>
      @if (loadingUsers()) {
        <div class="rounded-lg border px-3 py-2.5 text-[13px]" style="border-color:#E1E4E9;color:#9AA1AC">Loading users...</div>
      } @else if (candidates().length) {
        <select [(ngModel)]="userId" class="w-full rounded-lg border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9">
          <option value="">Select user</option>
          @for (user of candidates(); track user.id) {
            <option [value]="user.id">{{ user.fullName }} - {{ user.email }} ({{ user.employeeId }})</option>
          }
        </select>
      } @else if (userLoadError()) {
        <div class="rounded-lg border px-3 py-2.5 text-[13px]" style="border-color:#F3C7C4;color:#D0342C">
          {{ userLoadError() }}
          <button (click)="loadCandidates()" class="ml-2 font-semibold underline">Retry</button>
        </div>
      } @else {
        <div class="rounded-lg border px-3 py-2.5 text-[13px]" style="border-color:#E1E4E9;color:#9AA1AC">
          No active users are available to add.
        </div>
      }
    </div>

    <div>
      <label class="mb-1 block text-[12px] font-medium" style="color:#6B7280">Role *</label>
      <select [(ngModel)]="role" class="w-full rounded-lg border px-3 py-2.5 text-[13px] outline-none" style="border-color:#E1E4E9">
        @for (item of roles; track item) { <option [value]="item">{{ item }}</option> }
      </select>
    </div>

    <div class="flex gap-2 pt-1">
      <button (click)="submit()" [disabled]="submitting() || loadingUsers() || !userId || !projectId()" class="rounded-lg px-5 py-2.5 text-[13px] font-bold text-white disabled:opacity-60" style="background:#3B4FD9">Add Member</button>
      <button (click)="cancel()" class="rounded-lg border px-5 py-2.5 text-[13px] font-medium" style="border-color:#E1E4E9;color:#4B5160">Cancel</button>
    </div>
  </div>
</div>
