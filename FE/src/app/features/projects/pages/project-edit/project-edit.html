<a [routerLink]="['/projects', projectId]" class="mb-5 inline-flex text-[13px]" style="color:#3B4FD9">&lsaquo; Back to Project</a>

@if (loading()) {
  <div class="py-16 text-center text-[13px]" style="color:#9AA1AC">Loading project...</div>
} @else if (errorMessage()) {
  <div class="rounded-[10px] border p-5 text-[13px]" style="border-color:#F3C7C4;color:#D0342C">
    {{ errorMessage() }}
    <button (click)="ngOnInit()" class="ml-2 font-semibold underline">Retry</button>
  </div>
} @else {
<div class="rounded-[12px] border bg-white p-6" style="border-color:#E6E8EC;max-width:640px">
  <h2 class="mb-5 text-[16px] font-extrabold">Edit Project</h2>
  <div class="flex flex-col gap-3">
    <div><label class="mb-1 block text-[12px]" style="color:#6B7280">Project Code</label><input [value]="projectCode" disabled class="w-full rounded-[8px] border px-3 py-2.5 text-[13px] opacity-60" /></div>
    <div><label class="mb-1 block text-[12px]" style="color:#6B7280">Project Name *</label><input [(ngModel)]="projectName" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px]" /></div>
    <div><label class="mb-1 block text-[12px]" style="color:#6B7280">Description</label><textarea [(ngModel)]="description" rows="3" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px]"></textarea></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="mb-1 block text-[12px]" style="color:#6B7280">Start Date *</label><input [(ngModel)]="startDate" type="date" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px]" /></div>
      <div><label class="mb-1 block text-[12px]" style="color:#6B7280">End Date *</label><input [(ngModel)]="endDate" type="date" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px]" /></div>
    </div>
    <div><label class="mb-1 block text-[12px]" style="color:#6B7280">Status *</label><select [(ngModel)]="status" class="w-full rounded-[8px] border px-3 py-2.5 text-[13px]">@for (item of statuses; track item) { <option [value]="item">{{ item }}</option> }</select></div>
    <div class="flex gap-2 pt-2">
      <button (click)="submit()" [disabled]="submitting()" class="rounded-[8px] px-5 py-2.5 text-[13px] font-bold text-white disabled:opacity-60" style="background:#3B4FD9">Save</button>
      <a [routerLink]="['/projects', projectId]" class="rounded-[8px] border px-5 py-2.5 text-[13px]">Cancel</a>
    </div>
  </div>
</div>
}
