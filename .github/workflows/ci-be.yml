name: CI / Backend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'BE/**'
      - '.github/workflows/ci-be.yml'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BE

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mini-project-management-system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Apply database migrations for jOOQ codegen
        run: mvn flyway:migrate -Ddb.url=jdbc:postgresql://localhost:5432/mini-project-management-system

      - name: generate jOOQ classes
        run: mvn generate-sources -Ddb.url=jdbc:postgresql://localhost:5432/mini-project-management-system

      - name: Build and test
        run: mvn test
        env:
          MAVEN_OPTS: -Xmx1g
