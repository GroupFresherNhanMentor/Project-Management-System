name: CI / Backend

on:
  pull_request:
    branches: [develop]
    paths:
      - 'BE/**'
      - '.github/workflows/ci-be.yml'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BE

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mini-project-management-system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Apply database migrations for jOOQ codegen
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          for f in $(ls src/main/resources/db/migration/V*.sql | sort); do
            PGPASSWORD=postgres psql -h localhost -U postgres -d mini-project-management-system -f "$f"
          done

      - name: Build and test
        run: mvn -B test
        env:
          MAVEN_OPTS: -Xmx1g
