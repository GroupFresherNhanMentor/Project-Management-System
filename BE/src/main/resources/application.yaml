---
spring:
  application:
    name: project-management-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mini-project-management-system}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  jooq:
    sql-dialect: POSTGRES
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:k8wT5KF1ZrFojvpXJbhXOcYVv44lCKvOwQudCRY6HjxxTGH3WQbQDHEFZjhS+mCE}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}     # 15 minutes
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  seed:
    admin:
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:admin123}
      full-name: ${SEED_ADMIN_FULL_NAME:Project Manager Admin}
      email: ${SEED_ADMIN_EMAIL:admin@pms.com}
      employee-id: ${SEED_ADMIN_EMPLOYEE_ID:EMP-001}

logging:
  level:
    fpt.qn.pms: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: auth
      paths-to-match: /api/auth/**
      packages-to-scan: fpt.qn.pms.auth
    - group: users
      paths-to-match: /api/users/**
      packages-to-scan: fpt.qn.pms.user
    - group: tasks
      paths-to-match:
        - /api/tasks/**
        - /api/projects/{projectId}/task-statuses/**
        - /api/projects/{projectId}/task-workflow/**
      packages-to-scan: fpt.qn.pms.task
    - group: sprints
      paths-to-match: /api/projects/{projectId}/sprints/**
      packages-to-scan: fpt.qn.pms.sprint
    - group: worklogs
      paths-to-match: /api/worklogs/**, /api/tasks/*/worklogs, /api/reports/worklog
      packages-to-scan: fpt.qn.pms.worklog
    - group: reports
      paths-to-match: /api/reports/**
      packages-to-scan: fpt.qn.pms.worklog
